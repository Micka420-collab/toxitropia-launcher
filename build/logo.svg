<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1c15"/><stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.58">
      <stop offset="0" stop-color="#7CFFB9" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#3DDC84" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1C8F73" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tre" cx="0.5" cy="0.4" r="0.72">
      <stop offset="0" stop-color="#EAFFF3"/><stop offset="0.35" stop-color="#5BF2A0"/>
      <stop offset="0.8" stop-color="#23C07A"/><stop offset="1" stop-color="#0F6E47"/>
    </radialGradient>
    <linearGradient id="hzg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#E0992A"/>
    </linearGradient>
    <pattern id="hz" width="36" height="36" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#14110a"/>
      <rect width="18" height="36" fill="url(#hzg)"/>
    </pattern>
    <filter id="gg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- hazard-stripe frame (Minecraft caution block) -->
  <rect x="6" y="6" width="244" height="244" rx="30" fill="url(#hz)"/>
  <!-- weathering on the stripes : grime + rust spots -->
  <g filter="url(#soft)">
    <path d="M6 40 L70 6 L150 6 L40 120 Z" fill="#000000" opacity="0.16"/>
    <path d="M250 150 L250 250 L150 250 L240 130 Z" fill="#000000" opacity="0.18"/>
    <circle cx="36" cy="200" r="10" fill="#5a3a1c" opacity="0.45"/>
    <circle cx="220" cy="40" r="8" fill="#5a3a1c" opacity="0.4"/>
    <circle cx="200" cy="224" r="6" fill="#3a2510" opacity="0.5"/>
  </g>
  <rect x="6" y="6" width="244" height="244" rx="30" fill="#000000" opacity="0.12"/>

  <!-- inner dark panel -->
  <rect x="30" y="30" width="196" height="196" rx="18" fill="url(#bg)" stroke="#091a13" stroke-width="4"/>
  <rect x="30" y="30" width="196" height="196" rx="18" fill="url(#cglow)"/>
  <!-- panel inner rim light -->
  <rect x="32.5" y="32.5" width="191" height="191" rx="16" fill="none" stroke="#3DDC84" stroke-width="1.5" opacity="0.18"/>

  <!-- decay cracks in the panel -->
  <g stroke="#061009" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <path d="M46 64 L72 82 L62 108"/><path d="M210 158 L186 176 L196 206"/><path d="M150 40 L160 56"/>
  </g>

  <!-- radiation sparks around the trefoil -->
  <g fill="#7CFFB9">
    <circle cx="64" cy="76" r="2.6" opacity="0.85"/><circle cx="196" cy="92" r="2.2" opacity="0.7"/>
    <circle cx="78" cy="190" r="2.4" opacity="0.75"/><circle cx="188" cy="184" r="3" opacity="0.85"/>
    <circle cx="128" cy="40" r="2" opacity="0.6"/>
  </g>

  <!-- glowing radioactive trefoil (hero) -->
  <g transform="translate(128 126) scale(1.2)" filter="url(#gg)">
    <g fill="url(#tre)" stroke="#0B3A26" stroke-width="3">
      <path d="M0 -14 A14 14 0 0 1 12.1 -7 L70 -40 A82 82 0 0 0 0 -82 Z"/>
      <path d="M12.1 7 A14 14 0 0 1 0 14 L0 82 A82 82 0 0 0 71 41 Z"/>
      <path d="M-12.1 -7 A14 14 0 0 1 -12.1 7 L-71 41 A82 82 0 0 1 -70 -40 Z"/>
      <circle cx="0" cy="0" r="15"/>
    </g>
    <!-- bright core highlight -->
    <circle cx="0" cy="0" r="7" fill="#EAFFF3"/>
  </g>
</svg>
