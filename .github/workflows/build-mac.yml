# Build du launcher Toxitropia pour macOS (.dmg + .zip), arm64 + x64, et publication d'une
# Release PUBLIQUE téléchargeable par n'importe qui (sans compte GitHub).
# Déclenche : manuellement (Run workflow) ou en poussant un tag launcher-v* (→ crée la Release).
name: Build & Release launcher (macOS)

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write # nécessaire pour créer la Release

jobs:
  build-mac:
    # macos-14 = runner Apple Silicon (arm64). electron-builder télécharge aussi l'Electron x64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons (icns + ico)
        run: npm run icon

      - name: Build (.dmg + .zip)
        run: npm run build:mac
        env:
          # Build NON signé (pas de compte Apple Developer) → 1ᵉʳ lancement : clic droit › Ouvrir.
          # Pour signer+notariser : ajouter les secrets CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/
          # APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID et passer CSC_IDENTITY_AUTO_DISCOVERY à true.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts (debug / runs manuels)
        uses: actions/upload-artifact@v4
        with:
          name: toxitropia-launcher-mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

      - name: Publish public Release (sur tag launcher-v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Toxitropia Launcher ${{ github.ref_name }}
          body: |
            Launcher **Toxitropia** pour macOS (Apple Silicon arm64 + Intel x64).

            ## 📥 Téléchargement
            - **Mac Apple Silicon (M1/M2/M3/M4)** → le fichier `*-arm64.dmg`
            - **Mac Intel** → le fichier `*-x64.dmg`

            Ouvre le `.dmg`, glisse **Zarn** dans *Applications*.

            ⚠️ App non signée : au **premier lancement**, fais un **clic droit sur l'app › Ouvrir**
            (une seule fois), ou exécute `xattr -cr /Applications/Zarn.app`.
          files: |
            dist/*.dmg
            dist/*.zip
